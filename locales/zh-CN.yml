# Simplified Chinese UI copy. Keys must match locales/en.yml exactly;
# tests/l10n.rs enforces parity. Chinese has no plural forms, so `.one` and
# `.other` carry the same text. Git data (names, messages, OIDs) is never
# translated; proper nouns (GitCoat, README, Markdown, UTF-8) stay as-is.
_version: 1

layout:
  title: "%{name} · GitCoat"

nav:
  label: "页面导航"
  code: "代码"
  commits: "提交"

theme:
  toggle: "切换主题"
  to_dark: "切换到深色主题"
  to_light: "切换到浅色主题"

lang:
  label: "语言"

