    title: "页面未找到"
    text: "该地址下没有任何内容。"
  bad_request:
    title: "请求无效"
    text: "无法处理该请求。"
  internal:
    title: "出错了"
    text: "无法读取仓库，请稍后重试。"
  ref_not_found:
